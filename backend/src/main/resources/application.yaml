spring:
  application:
    name: aegisvault

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  datasource:
    url: jdbc:h2:file:./data/aegisvault;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    clean-disabled: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: false

  thymeleaf:
    cache: false

server:
  address: 127.0.0.1
  port: 8081
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

logging:
  file:
    name: ./logs/aegisvault.log
  level:
    root: INFO
