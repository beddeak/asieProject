spring:
  application:
    name: aegisvault

  datasource:
    url: jdbc:h2:file:./data/aegisvault;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: false

  thymeleaf:
    cache: false

server:
  address: 127.0.0.1
  port: 8081

logging:
  file:
    name: ./logs/aegisvault.log
  level:
    root: INFO