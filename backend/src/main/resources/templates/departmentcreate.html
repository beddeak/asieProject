<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부서 생성 | AegisVault</title>
    <link rel="stylesheet" href="/css/departmentcreate.css" th:href="@{/css/departmentcreate.css}">
</head>
<body class="department-create-page">
    <main class="department-create-shell">
        <!-- 관리자 페이지에서 이 fragment를 불러올 때도 CSS와 departmentCreate 모델이 필요합니다. -->
        <section class="department-create-panel" th:fragment="departmentForm" aria-labelledby="department-create-title">
            <header class="department-create-header">
                <p class="department-create-label">AEGISVAULT / 조직 관리</p>
                <h1 id="department-create-title">부서 생성</h1>
                <p>새로운 부서의 이름과 설명을 등록합니다.</p>
            </header>

            <form action="/dep/create" th:action="@{/dep/create}"
                  th:object="${departmentCreate}" method="post">
                <div class="department-create-error" role="alert"
                     th:if="${errorMessage != null}" th:text="${errorMessage}"
                     hidden th:hidden="${false}"></div>
                <div class="department-create-error" role="alert"
                     th:if="${#fields.hasErrors('*')}" hidden th:hidden="${false}">
                    <p th:each="error : ${#fields.errors('*')}" th:text="${error}"></p>
                </div>

                <div class="department-create-field">
                    <label for="department-name">부서 이름 <span>필수</span></label>
                    <input id="department-name" name="name" type="text" th:value="*{name}"
                           maxlength="255" required pattern=".*\S.*"
                           title="공백이 아닌 부서 이름을 입력해 주세요."
                           placeholder="예: 연구개발본부" aria-describedby="department-name-hint">
                    <p id="department-name-hint" class="department-create-hint">이미 등록된 부서 이름은 사용할 수 없습니다.</p>
                </div>

                <div class="department-create-field">
                    <label for="department-description">설명 <span>선택</span></label>
                    <textarea id="department-description" name="description" th:text="*{description}"
                              rows="4" maxlength="2000" placeholder="부서의 주요 업무를 입력하세요"
                              aria-describedby="department-description-hint"></textarea>
                    <p id="department-description-hint" class="department-create-hint">최대 2,000자</p>
                </div>

                <div class="department-create-actions">
                    <button type="submit">부서 생성</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
