<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/shell :: head('전체 감사 로그')}"></head>
  <body>
    <header th:replace="~{fragments/shell :: header}"></header>
    <main id="main" class="workspace">
      <div th:replace="~{fragments/shell :: messages}"></div>
      <header class="page-heading">
        <div>
          <p class="eyebrow">AUDIT TRAIL</p>
          <h1>전체 감사 로그</h1>
          <p class="muted">
            로그인·권한 거부·사용자 관리·문서·프로젝트·배포 기록을 확인합니다.
          </p>
        </div>
        <form th:action="@{/admin/audit/verify}" method="post">
          <button class="secondary">로그 무결성 검사</button>
        </form>
      </header>
      <p
        class="notice"
        th:if="${verification!=null}"
        th:classappend="${verification.valid?'success':'danger'}"
        th:text="${verification.message}+' · 확인 번호 '+${verification.sequence}"
      ></p>
      <section class="card">
        <form class="toolbar">
          <label
            >계정<input
              name="actor"
              th:value="${actor}"
              placeholder="정확한 로그인 아이디" /></label
          ><label
            >작업 코드<input
              name="action"
              th:value="${action}"
              placeholder="예: LOGIN_FAILED" /></label
          ><button>조회</button>
        </form>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>번호</th>
                <th>시각</th>
                <th>계정</th>
                <th>작업</th>
                <th>내용</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="r:${records}">
                <td th:text="${r.id}"></td>
                <td th:text="${r.occurredAt}"></td>
                <td th:text="${r.actor}"></td>
                <td th:text="${r.action}"></td>
                <td th:text="${r.description}"></td>
              </tr>
              <tr th:if="${records.empty}">
                <td colspan="5" class="empty">조건에 맞는 기록이 없습니다.</td>
              </tr>
            </tbody>
          </table>
        </div>
        <nav th:replace="~{fragments/shell :: pager(${records},'page')}"></nav>
      </section>
    </main>
    <footer th:replace="~{fragments/shell :: footer}"></footer>
  </body>
</html>
