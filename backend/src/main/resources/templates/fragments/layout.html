<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<th:block th:fragment="header(activePage, signedIn)" th:with="currentPage=${navigationPage != null ? navigationPage : activePage}">
    <header class="masthead">
        <div class="masthead-inner">
            <a class="archive-brand" href="/" th:href="@{/}" aria-label="AegisVault 기록 보관소 홈">
                <svg class="archive-seal" viewBox="0 0 96 96" fill="none" aria-hidden="true">
                    <path d="M48 4 86 26v44L48 92 10 70V26Z" stroke="currentColor" stroke-width="2"/>
                    <path d="M48 12 79 30v36L48 84 17 66V30Z" stroke="currentColor" stroke-opacity=".4"/>
                    <path d="M29 30h38v26c0 11-11 18-19 22-8-4-19-11-19-22Z" fill="currentColor" fill-opacity=".08" stroke="currentColor" stroke-width="2"/>
                    <path d="m36 58 12-24 12 24M41 49h14" stroke="currentColor" stroke-width="3"/>
                    <path d="M48 4v8M86 26l-7 4M86 70l-7-4M48 92v-8M10 70l7-4M10 26l7 4" stroke="currentColor" stroke-width="2"/>
                </svg>
                <span class="brand-type">
                    <span class="brand-name">AegisVault</span>
                    <span class="brand-subtitle">기술 기록 보관소</span>
                    <span class="brand-caption">AEGIS DEFENSE TECHNOLOGIES</span>
                </span>
            </a>
            <div class="masthead-account" th:if="${signedIn}">
                <span class="session-label">사내 접속</span>
                <a class="account-name" th:href="@{/account}" th:attr="aria-current=${currentPage == 'account' ? 'page' : null}"><strong th:if="${workspaceAccount != null}" th:text="${workspaceAccount.name}">사용자</strong><strong th:unless="${workspaceAccount != null}" sec:authentication="name">사용자</strong><span> · 내 계정</span></a>
                <nav class="masthead-tools" aria-label="계정 메뉴">
                    <a th:href="@{/notifications}" th:attr="aria-current=${currentPage == 'notifications' ? 'page' : null}">알림 <span class="notification-count" th:if="${workspaceAccount != null}" th:text="${workspaceAccount.unread}" th:attr="aria-label=${'읽지 않은 알림 ' + workspaceAccount.unread + '개'}">0</span></a>
                    <a th:href="@{/admin/users}" sec:authorize="hasRole('ADMIN')" th:if="${workspaceAccount != null and workspaceAccount.admin}" th:attr="aria-current=${currentPage == 'admin' ? 'page' : null}">관리</a>
                    <form action="/logout" th:action="@{/logout}" method="post"><button class="logout-link" type="submit">로그아웃</button></form>
                </nav>
            </div>
            <span class="masthead-guest" th:unless="${signedIn}">INTERNAL DOCUMENT ARCHIVE</span>
        </div>
    </header>
    <div class="primary-nav">
        <div class="primary-nav-inner">
            <nav class="primary-nav-main" aria-label="주 메뉴" th:if="${signedIn}">
                <a href="/" th:href="@{/}" th:attr="aria-current=${currentPage == 'home' ? 'page' : null}">홈</a>
                <a href="/document/list" th:href="@{/document/list}" th:attr="aria-current=${currentPage == 'documents' or currentPage == 'detail' or currentPage == 'write' or currentPage == 'review' ? 'page' : null}">문서</a>
                <a th:href="@{/projects}" th:attr="aria-current=${currentPage == 'projects' ? 'page' : null}">프로젝트</a>
                <a th:href="@{/departments}" th:attr="aria-current=${currentPage == 'departments' ? 'page' : null}">부서</a>
                <a th:href="@{/tasks}" th:attr="aria-current=${currentPage == 'tasks' ? 'page' : null}">내 업무</a>
                <a th:href="@{/announcements}" th:attr="aria-current=${currentPage == 'announcements' ? 'page' : null}">전체 공지</a>
                <a th:href="@{/access}" th:attr="aria-current=${currentPage == 'access' ? 'page' : null}">임시 접근</a>
            </nav>
            <nav class="primary-nav-tools" aria-label="문서 작업" th:if="${signedIn}">
                <a href="/document/new" th:href="@{/document/new}" th:if="${canWrite == null or canWrite}">문서 작성</a>
                <a href="/document/review" th:href="@{/document/review}" th:if="${canReview == true}" sec:authorize="hasAnyRole('MANAGER', 'DEPUTY_GENERAL_MANAGER', 'GENERAL_MANAGER', 'EXECUTIVE', 'ADMIN')">문서 검토</a>
            </nav>
            <nav class="primary-nav-main" aria-label="주 메뉴" th:unless="${signedIn}">
                <a href="/user/login" th:href="@{/user/login}" th:attr="aria-current=${currentPage == 'login' ? 'page' : null}">로그인</a>
                <a href="/user/signup" th:href="@{/user/signup}" th:attr="aria-current=${currentPage == 'signup' ? 'page' : null}">계정 등록</a>
            </nav>
        </div>
    </div>
</th:block>
<footer class="site-footer" th:fragment="footer"><span>Aegis Defense Technologies · AegisVault</span></footer>
</body>
</html>
