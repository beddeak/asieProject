<!doctype html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <body>
    <th:block th:fragment="header">
      <th:block
        th:replace="~{fragments/layout :: header('departments', true)}"
      ></th:block>
    </th:block>
    <nav
      class="department-tabs"
      aria-label="부서 탭"
      th:fragment="tabs(workspace)"
      th:if="${!#lists.isEmpty(workspace.tabs)}"
    >
      <a
        th:each="department : ${workspace.tabs}"
        class="department-tab"
        th:href="@{/departments/{id}(id=${department.id})}"
        th:text="${department.name}"
        th:attr="aria-current=${workspace.selected != null and department.id == workspace.selected.id ? 'page' : null}"
      ></a>
    </nav>
  </body>
</html>
