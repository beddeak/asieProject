<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <body>
    <section
      th:fragment="summary(gate,project)"
      class="review-summary"
      aria-labelledby="review-summary-title"
    >
      <div class="row review-heading">
        <h2 id="review-summary-title">문서 변경과 검증 상태</h2>
        <a th:href="@{/projects/{id}(id=${project.id})}"
          >현재 프로젝트 문서 보기</a
        >
      </div>
      <p class="muted">
        시험·검토 당시의 문서 버전과 현재 배포 대상을 비교합니다. 문서나 검증
        조건이 바뀌면 현재 구성을 다시 검증해야 합니다.
      </p>
      <div class="grid review-grid">
        <article
          th:replace="~{fragments/reviewevidence :: review(${gate.qualityReview},${project},'quality','품질시험')}"
        ></article>
        <article
          th:replace="~{fragments/reviewevidence :: review(${gate.securityReview},${project},'security','보안 검토')}"
        ></article>
      </div>
    </section>
    <article
      th:fragment="review(review,project,kind,title)"
      class="card review-card"
      th:attr="data-review=${kind},data-state=${review.state}"
    >
      <div class="row review-heading">
        <h3 th:text="${title}"></h3>
        <span
          class="badge"
          th:classappend="${review.state.name()=='CURRENT'?'good':review.state.name()=='STALE' or review.state.name()=='FAILED'?'bad':''}"
          th:text="${review.label}"
        ></span>
      </div>
      <small
        th:if="${review.id!=null}"
        th:text="'최근 '+${title}+' #'+${review.id}"
      ></small>
      <p class="review-message" th:text="${review.message}"></p>
      <ul class="review-changes" th:if="${!review.changes.empty}">
        <li th:each="change:${review.changes}">
          <strong
            class="review-document-title"
            th:text="${change.title}"
          ></strong>
          <small th:text="'문서 #'+${change.documentId}"></small>
          <div class="row review-versions">
            <a
              th:if="${change.previousVersionId!=null and change.previousReadable}"
              th:href="@{/document/versions/{id}(id=${change.previousVersionId})}"
              th:text="'검증 당시 v'+${change.previousNumber}"
            ></a>
            <span
              th:if="${change.previousVersionId!=null and !change.previousReadable}"
              class="muted"
              th:text="'검증 당시 v'+${change.previousNumber}+' · 열람 제한'"
            ></span>
            <span th:if="${change.previousVersionId==null}" class="muted"
              >검증 당시 미포함</span
            >
            <span aria-hidden="true">→</span>
            <a
              th:if="${change.currentVersionId!=null and change.currentReadable}"
              th:href="@{/document/versions/{id}(id=${change.currentVersionId})}"
              th:text="'현재 v'+${change.currentNumber}"
            ></a>
            <span
              th:if="${change.currentVersionId!=null and !change.currentReadable}"
              class="muted"
              th:text="'현재 v'+${change.currentNumber}+' · 열람 제한'"
            ></span>
            <span th:if="${change.currentVersionId==null}" class="muted"
              >현재 배포 대상에서 제외</span
            >
          </div>
        </li>
      </ul>
      <div class="actions">
        <a
          class="button secondary"
          th:href="@{/projects/{id}/work(id=${project.id},tab=${kind})} + '#' + ${kind} + '-review'"
          th:text="${kind=='quality'?(project.canQuality?'품질시험으로 이동':'품질시험 이력 보기'):(project.canSecurity?'보안 검토로 이동':'보안 검토 이력 보기')}"
        ></a>
      </div>
    </article>
  </body>
</html>
