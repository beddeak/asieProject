<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/shell :: head('비밀번호 재설정')}"></head>
  <body>
    <header th:replace="~{fragments/shell :: header}"></header>
    <main id="main" class="workspace narrow">
      <div th:replace="~{fragments/shell :: messages}"></div>
      <header class="page-heading">
        <div>
          <p class="eyebrow">RESET PASSWORD</p>
          <h1>새 비밀번호 설정</h1>
          <p class="muted">
            복구 링크는 발급 후 30분 동안 한 번만 사용할 수 있습니다.
          </p>
        </div>
      </header>
      <section class="card">
        <form class="form-grid" th:action="@{/account/reset}" method="post">
          <input type="hidden" name="token" th:value="${token}" /><label
            >새 비밀번호<input
              type="password"
              name="password"
              autocomplete="new-password"
              minlength="8"
              required /></label
          ><label
            >새 비밀번호 확인<input
              type="password"
              name="confirmation"
              autocomplete="new-password"
              minlength="8"
              required /></label
          ><button>비밀번호 재설정</button>
        </form>
      </section>
    </main>
    <footer th:replace="~{fragments/shell :: footer}"></footer>
  </body>
</html>
