<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/shell :: head('프로젝트')}"></head>
  <body>
    <header th:replace="~{fragments/shell :: header}"></header>
    <main id="main" class="workspace">
      <div th:replace="~{fragments/shell :: messages}"></div>
      <header class="page-heading">
        <div>
          <p class="eyebrow">PROJECT PORTFOLIO</p>
          <h1>프로젝트</h1>
          <p class="page-description">
            문서와 참여자, 검토 결과를 프로젝트별로 관리합니다.
          </p>
        </div>
        <a class="button" th:href="@{/projects/new}">새 프로젝트</a>
      </header>
      <section class="card">
        <form class="toolbar" method="get">
          <label
            >프로젝트 검색<input
              name="keyword"
              th:value="${keyword}"
              placeholder="프로젝트 이름" /></label
          ><label
            >진행 상태<select name="status">
              <option value="">전체 상태</option>
              <option
                th:each="status:${statuses}"
                th:value="${status}"
                th:text="${status.label}"
                th:selected="${status==selectedStatus}"
              ></option></select></label
          ><button type="submit">검색</button>
        </form>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>프로젝트</th>
                <th>담당 부서</th>
                <th>진행 상태</th>
                <th>목표일</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="p:${projects}">
                <td>
                  <a
                    th:href="@{/projects/{id}(id=${p.id})}"
                    th:text="${p.name}"
                  ></a>
                </td>
                <td th:text="${p.departmentName}"></td>
                <td><span class="badge" th:text="${p.status.label}"></span></td>
                <td th:text="${p.targetDate?:'미정'}"></td>
              </tr>
              <tr th:if="${projects.empty}">
                <td colspan="4" class="empty">
                  참여 중인 프로젝트가 없습니다.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <nav th:replace="~{fragments/shell :: pager(${projects},'page')}"></nav>
      </section>
    </main>
    <footer th:replace="~{fragments/shell :: footer}"></footer>
  </body>
</html>
